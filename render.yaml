# Settlement worker, hosted.
#
# It runs as a *web* service rather than a background worker because Render's
# background workers cost more. The process still does the same polling loop; the
# HTTP endpoint exists so the host has something to health-check.
#
# The plan is "starter", not "free", deliberately. Free web services sleep after
# fifteen minutes idle, and the thing meant to wake this one was a GitHub cron on
# a "*/5" schedule that GitHub actually runs every three to four hours. An escrow
# deadline is ten minutes, so a sleeping worker cannot settle anything in time —
# order #184451 expired undelivered and had to be refunded by hand. If you do move
# this back to free, the worker is decorative unless something external pings it
# every few minutes.
#
# Secrets are marked sync:false — they are set once in Render's dashboard and
# never live in this file.
#
# Mainnet flip (see launch/MAINNET-FLIP.md). There is one worker and at the flip it
# becomes MAINNET ONLY. The values below stay testnet until that day, because a push
# to this file redeploys the worker. On the day, set these in the dashboard first,
# then commit the same values here so a later push cannot put testnet back:
#   CHAIN_ID=5042, and the unprefixed chain vars the worker reads (chain/config.js):
#   RPC_URL, ERC8183_ADDRESS, USDC_ADDRESS, IDENTITY_REGISTRY, EXPLORER and
#   EXPLORER_API (Blockscout's /api/v2 root), all from Circle's published values.
#   Off testnet none of them has a default: a missing one stops the worker, it never
#   falls back to a testnet address.
#   KEYSTORE_PASSWORD_MAINNET, PROVIDER_MAINNET_KEYSTORE_B64, EVALUATOR_MAINNET_KEYSTORE_B64
#   (sync:false), and remove the testnet KEYSTORE_PASSWORD / *_KEYSTORE_B64 pair.
#   SWEEP_TO (the cold wallet) and SWEEP_KEEP=3. sweep.js never keeps less than
#   refunds and sub-orders need, whatever SWEEP_KEEP says.
#   DESK_TRANSFER_REFUNDS stays unset: off by default anywhere but testnet.
#   CARD_PATH needs no value: it defaults to agents/mainnet on chain 5042.

services:
  - type: web
    name: stubly-worker
    runtime: node
    plan: starter
    region: oregon
    branch: master
    buildCommand: npm ci --omit=dev --ignore-scripts
    startCommand: npm run serve
    healthCheckPath: /
    envVars:
      - key: POLL_MS
        value: "10000"
      - key: CHAIN_ID
        value: "5042002"
      - key: ERC8183_ADDRESS
        value: "0x0747EEf0706327138c69792bF28Cd525089e4583"
      - key: USDC_ADDRESS
        value: "0x3600000000000000000000000000000000000000"
      - key: EXPLORER_API
        value: "https://testnet.arcscan.app/api/v2"
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash"
      - key: RPC_URL
        sync: false
      - key: KEYSTORE_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SITE_URL
        sync: false
      - key: PUBLISH_SECRET
        sync: false
      # The two signing wallets, base64 of their encrypted keystore files.
      - key: PROVIDER_KEYSTORE_B64
        sync: false
      - key: EVALUATOR_KEYSTORE_B64
        sync: false
      # Cold address that earnings above the working float are swept to. The
      # provider key both signs payouts and receives them, and it now lives in a
      # fourth place. This caps what a leak costs to the float. Unset = no sweep.
      - key: SWEEP_TO
        sync: false
