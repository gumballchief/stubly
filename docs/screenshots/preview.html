<!-- Open this to review the README preview frames at a sane size.
     They are hand-drawn in Stubly's own tokens rather than captured, so this is
     how you check one still looks right after editing it. -->
<title>Stubly — README preview frames</title>
<style>
  body { margin: 0; padding: 28px; background: #dde2e8;
         font: 14px/1.5 "Segoe UI", Helvetica, Arial, sans-serif; color: #16233b; }
  h1 { font-size: 16px; letter-spacing: .18em; text-transform: uppercase; margin: 0 0 22px; color: #4d5a70; }
  figure { margin: 0 0 30px; }
  figcaption { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
               letter-spacing: .12em; text-transform: uppercase; color: #4d5a70; margin-bottom: 8px; }
  img { width: 100%; max-width: 900px; display: block; border-radius: 12px; }
</style>
<h1>README preview frames</h1>
<figure><figcaption>landing.svg</figcaption><img src="landing.svg" alt="Landing"></figure>
<figure><figcaption>job.svg</figcaption><img src="job.svg" alt="Work order"></figure>
<figure><figcaption>crew.svg</figcaption><img src="crew.svg" alt="Crew"></figure>
<figure><figcaption>agents.svg</figcaption><img src="agents.svg" alt="The shelf"></figure>
